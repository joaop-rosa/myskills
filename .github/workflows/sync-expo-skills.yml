name: Sync Expo Skills

on:
  schedule:
    # Diariamente às 06:00 BRT (09:00 UTC)
    - cron: "0 9 * * *"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: sync-expo-skills
  cancel-in-progress: false

jobs:
  sync:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Sync upstream Expo skills
        run: python3 cli.py update-expo --summary-json "${RUNNER_TEMP}/expo-sync.json"

      - name: Commit and push changes to main
        run: |
          python3 - <<'PY'
          import json
          import os
          import subprocess
          from pathlib import Path

          summary = json.loads(Path(os.environ["RUNNER_TEMP"], "expo-sync.json").read_text(encoding="utf-8"))
          summary_file = Path(os.environ["GITHUB_STEP_SUMMARY"])
          target_dir = summary["target_dir"]

          def run(cmd: list[str], input_text: str | None = None) -> subprocess.CompletedProcess[str]:
              return subprocess.run(cmd, check=True, text=True, capture_output=True, input=input_text)

          status_res = run(["git", "status", "--porcelain", "-uall", "--", target_dir, "sources.json"])
          has_git_changes = bool(status_res.stdout.strip())

          if not summary["changed"] and not has_git_changes:
              summary_file.write_text(
                  "## Sync Expo Skills\n\n"
                  f"Nenhuma alteração detectada no upstream (`{summary['short_sha']}`). "
                  f"{summary['unchanged_count']} skills permanecem atualizadas.\n",
                  encoding="utf-8",
              )
              raise SystemExit(0)

          run(["git", "config", "user.name", "github-actions[bot]"])
          run(["git", "config", "user.email", "41898282+github-actions[bot]@users.noreply.github.com"])
          run(["git", "add", "-A", "--", target_dir, "sources.json"])

          staged_diff = subprocess.run(["git", "diff", "--cached", "--quiet"])
          if staged_diff.returncode == 0:
              summary_file.write_text(
                  "## Sync Expo Skills\n\nNenhuma mudança efetiva para commitar.\n",
                  encoding="utf-8",
              )
              raise SystemExit(0)

          body_lines = [f"Upstream: https://github.com/expo/skills/commit/{summary['commit_sha']}"]
          if summary["added"]:
              body_lines.append(f"Added ({len(summary['added'])}): {', '.join(summary['added'])}")
          if summary["updated"]:
              body_lines.append(f"Updated ({len(summary['updated'])}): {', '.join(summary['updated'])}")
          if summary["removed"]:
              body_lines.append(f"Removed ({len(summary['removed'])}): {', '.join(summary['removed'])}")

          commit_msg = f"chore(expo): sync upstream skills ({summary['short_sha']})\n\n" + "\n".join(body_lines) + "\n"
          run(["git", "commit", "-F", "-"], input_text=commit_msg)
          run(["git", "pull", "--rebase", "origin", "main"])
          run(["git", "push", "origin", "HEAD:main"])

          report_lines = [
              "## Sync Expo Skills — Atualização aplicada em `main`",
              "",
              f"- **Commit upstream:** `{summary['short_sha']}`",
              f"- **Diretório:** `{target_dir}`",
              f"- **Adicionadas:** {', '.join(summary['added']) if summary['added'] else 'nenhuma'}",
              f"- **Atualizadas:** {', '.join(summary['updated']) if summary['updated'] else 'nenhuma'}",
              f"- **Removidas:** {', '.join(summary['removed']) if summary['removed'] else 'nenhuma'}",
              f"- **Sem alterações:** {summary['unchanged_count']}",
              "",
          ]
          summary_file.write_text("\n".join(report_lines), encoding="utf-8")
          PY
