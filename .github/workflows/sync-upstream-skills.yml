name: Sync Upstream Skills

on:
  schedule:
    # Diariamente às 06:00 BRT (09:00 UTC)
    - cron: "0 9 * * *"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: sync-upstream-skills
  cancel-in-progress: false

jobs:
  sync:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Sync all upstream skill sources
        run: python3 cli.py update-upstream --summary-json "${RUNNER_TEMP}/upstream-sync.json"

      - name: Commit and push changes to main
        run: |
          python3 - <<'PY'
          import json
          import os
          import subprocess
          from pathlib import Path

          summary = json.loads(Path(os.environ["RUNNER_TEMP"], "upstream-sync.json").read_text(encoding="utf-8"))
          sources_cfg = json.loads(Path("sources.json").read_text(encoding="utf-8"))
          summary_file = Path(os.environ["GITHUB_STEP_SUMMARY"])
          src_entries = summary["sources"]
          target_dirs = [src["target_dir"] for src in src_entries]
          tracked_paths = [*target_dirs, "sources.json"]

          def run(cmd: list[str], input_text: str | None = None) -> subprocess.CompletedProcess[str]:
              return subprocess.run(cmd, check=True, text=True, capture_output=True, input=input_text)

          status_res = run(["git", "status", "--porcelain", "-uall", "--", *tracked_paths])
          has_git_changes = bool(status_res.stdout.strip())

          if not summary["changed"] and not has_git_changes:
              lines = ["## Sync Upstream Skills", "", "Nenhuma alteração detectada nas fontes upstream:", ""]
              for src in src_entries:
                  lines.append(f"- **{src['source']}** (`{src['short_sha']}`): {src['unchanged_count']} skill(s) atualizadas.")
              summary_file.write_text("\n".join(lines) + "\n", encoding="utf-8")
              raise SystemExit(0)

          run(["git", "config", "user.name", "github-actions[bot]"])
          run(["git", "config", "user.email", "41898282+github-actions[bot]@users.noreply.github.com"])
          run(["git", "add", "-A", "--", *tracked_paths])

          staged_diff = subprocess.run(["git", "diff", "--cached", "--quiet"])
          if staged_diff.returncode == 0:
              summary_file.write_text("## Sync Upstream Skills\n\nNenhuma mudança efetiva para commitar.\n", encoding="utf-8")
              raise SystemExit(0)

          changed_sources = [src for src in src_entries if src["changed"]]
          if len(changed_sources) == 1:
              only = changed_sources[0]
              title = f"chore({only['source']}): sync upstream skills ({only['short_sha']})"
          else:
              labels = ", ".join(f"{src['source']}@{src['short_sha']}" for src in changed_sources) or "sources"
              title = f"chore(upstream): sync upstream skills ({labels})"

          body_lines: list[str] = []
          for src in changed_sources:
              repo_url = sources_cfg.get(src["source"], {}).get("repo", "").removesuffix(".git")
              if repo_url:
                  body_lines.append(f"[{src['source']}] {repo_url}/commit/{src['commit_sha']}")
              if src["added"]:
                  body_lines.append(f"[{src['source']}] Added ({len(src['added'])}): {', '.join(src['added'])}")
              if src["updated"]:
                  body_lines.append(f"[{src['source']}] Updated ({len(src['updated'])}): {', '.join(src['updated'])}")
              if src["removed"]:
                  body_lines.append(f"[{src['source']}] Removed ({len(src['removed'])}): {', '.join(src['removed'])}")

          commit_msg = title + ("\n\n" + "\n".join(body_lines) if body_lines else "") + "\n"
          run(["git", "commit", "-F", "-"], input_text=commit_msg)
          run(["git", "pull", "--rebase", "origin", "main"])
          run(["git", "push", "origin", "HEAD:main"])

          report_lines = ["## Sync Upstream Skills — Atualização aplicada em `main`", ""]
          for src in src_entries:
              report_lines.extend([
                  f"### Fonte `{src['source']}` (`{src['short_sha']}`)",
                  f"- **Diretório:** `{src['target_dir']}`",
                  f"- **Adicionadas:** {', '.join(src['added']) if src['added'] else 'nenhuma'}",
                  f"- **Atualizadas:** {', '.join(src['updated']) if src['updated'] else 'nenhuma'}",
                  f"- **Removidas:** {', '.join(src['removed']) if src['removed'] else 'nenhuma'}",
                  f"- **Sem alterações:** {src['unchanged_count']}",
                  "",
              ])
          summary_file.write_text("\n".join(report_lines), encoding="utf-8")
          PY
